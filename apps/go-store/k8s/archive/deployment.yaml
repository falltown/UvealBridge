apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-store
  namespace: go-store
  labels:
    app: go-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-store
  template:
    metadata:
      labels:
        app: go-store
    spec:
      containers:
        - name: go-store
          image: acruvealbridge.azurecr.io/go-store:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
